<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUTCH — Claude's Live Usage & Team Conversation History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111827; color: #f3f4f6; min-height: 100vh; padding: 24px; }
    h1 { text-align: center; margin-bottom: 4px; font-size: 1.6rem; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #9ca3af; margin-bottom: 24px; font-size: 0.85rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    .error { background: rgba(127,29,29,0.5); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .hidden { display: none; }
    .card { background: #1f2937; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 1rem; margin-bottom: 16px; color: #e5e7eb; }

    /* Upload */
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 768px) { .upload-grid { grid-template-columns: 1fr; } }
    .upload-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; border: 2px dashed #4b5563; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
    .upload-zone.loaded { border-color: #22c55e; background: rgba(34,197,94,0.1); }
    .upload-zone input { display: none; }
    .upload-zone span { color: #9ca3af; font-size: 0.8rem; margin-top: 8px; text-align: center; }
    .upload-zone .label { font-weight: 500; color: #d1d5db; margin-bottom: 4px; }
    .folder-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; border: 2px dashed #3b82f6; border-radius: 10px; cursor: pointer; transition: all 0.2s; background: rgba(59,130,246,0.05); margin-bottom: 16px; text-align: center; }
    .folder-zone:hover { background: rgba(59,130,246,0.12); border-color: #60a5fa; }
    .folder-zone.loaded { border-color: #22c55e; background: rgba(34,197,94,0.08); }
    .folder-icon { font-size: 2rem; margin-bottom: 6px; }
    .folder-label { font-size: 1rem; font-weight: 600; color: #e5e7eb; margin-bottom: 4px; }
    .folder-sub { font-size: 0.8rem; color: #6b7280; max-width: 380px; }
    .detected-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #374151; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; }
    .detected-row.found { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); }
    .detected-row.missing { opacity: 0.5; }
    .det-icon { width: 22px; }
    .det-label { flex: 1; color: #9ca3af; }
    .det-val { font-weight: 500; color: #f3f4f6; font-size: 0.8rem; }
    .or-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #4b5563; font-size: 0.8rem; }
    .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: #374151; }
    input[type="text"] { width: 100%; background: #374151; border: 1px solid #4b5563; border-radius: 6px; padding: 10px 12px; color: #f3f4f6; font-size: 0.875rem; }
    input[type="text"]:focus { outline: none; border-color: #3b82f6; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }

    /* Stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card { background: #1f2937; border-radius: 8px; padding: 16px 18px; }
    .stat-card .stat-label { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: #f3f4f6; }
    .stat-card .stat-sub { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }

    /* Period tabs */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-header h3 { font-size: 0.9rem; color: #9ca3af; font-weight: 500; }
    .period-tabs { display: flex; gap: 4px; }
    .period-btn { background: #374151; color: #9ca3af; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: 500; transition: all 0.15s; }
    .period-btn:hover { background: #4b5563; color: #f3f4f6; }
    .period-btn.active { background: #1d4ed8; color: #bfdbfe; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table th { text-align: left; padding: 8px 12px; color: #6b7280; font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #374151; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid #1a2332; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: #283548; cursor: pointer; }
    .data-table tbody tr.non-clickable:hover td { cursor: default; }
    .bar-wrap { background: #374151; border-radius: 4px; height: 8px; overflow: hidden; min-width: 80px; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .bar-fill.blue { background: #3b82f6; }
    .bar-fill.teal { background: #14b8a6; }
    .rank { font-size: 0.75rem; color: #6b7280; width: 28px; }
    .user-name-cell { font-weight: 500; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab-btn { background: #374151; color: #9ca3af; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
    .tab-btn:hover { background: #4b5563; color: #f3f4f6; }
    .tab-btn.active { background: #3b82f6; color: white; }

    /* User detail */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #374151; color: #9ca3af; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; margin-bottom: 16px; transition: all 0.15s; }
    .back-btn:hover { background: #4b5563; color: #f3f4f6; }
    .user-detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .user-detail-header h2 { font-size: 1.3rem; }
    .user-detail-header .meta { font-size: 0.82rem; color: #6b7280; }

    /* Conversations */
    .conv-header-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    .conv-header-bar input { flex: 1; min-width: 200px; }
    .conv-header-bar .info { font-size: 0.85rem; color: #9ca3af; }
    .no-data { background: #1f2937; border-radius: 8px; padding: 40px 20px; text-align: center; color: #6b7280; }
    .conversation { background: #1f2937; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .conv-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.15s; }
    .conv-header:hover { background: #283548; }
    .conv-header .arrow { color: #6b7280; transition: transform 0.2s; font-size: 0.75rem; }
    .conv-header.expanded .arrow { transform: rotate(90deg); }
    .conv-title { flex: 1; min-width: 0; }
    .conv-title h3 { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-title p { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }
    .conv-badge { font-size: 0.7rem; background: #374151; padding: 3px 8px; border-radius: 10px; white-space: nowrap; color: #9ca3af; }
    .messages { border-top: 1px solid #374151; padding: 16px; max-height: 500px; overflow-y: auto; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .message:last-child { margin-bottom: 0; }
    .message.human { background: rgba(59,130,246,0.12); margin-right: 30px; border-left: 3px solid #3b82f6; }
    .message.assistant { background: rgba(75,85,99,0.25); margin-left: 30px; border-left: 3px solid #4b5563; }
    .message .sender { font-size: 0.7rem; color: #6b7280; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .message .text { font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

    /* Sidebar actions */
    .top-actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .top-actions button, .top-actions label { font-size: 0.82rem; padding: 7px 14px; }
  </style>
</head>

        </div>

        <!-- User Leaderboard -->
        <div class="card">
          <div class="section-header">
            <h3>Users — click to drill down</h3>
            <input type="text" id="user-search" placeholder="Search users..." style="width:200px;">
          </div>
          <div id="user-leaderboard"></div>
        </div>

      <!-- Projects Overview -->
      <div class="card" id="projects-overview" style="display:none;">
        <div class="section-header">
          <h3>Projects</h3>
          <span id="projects-count" style="font-size:0.8rem;color:#6b7280;"></span>
        </div>
        <div id="projects-table"></div>
      </div>

      </div>

      <!-- User Detail -->
      <div id="user-detail" class="hidden">
        <button class="back-btn" onclick="backToOverview()">← Team Overview</button>
        <div class="user-detail-header">
          <h2 id="user-detail-name"></h2>
          <span class="meta" id="user-detail-meta"></span>
        </div>

        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('conversations')">💬 Conversations</button>
          <button class="tab-btn" onclick="switchTab('usage')">📊 Usage Summary</button>
          <button class="tab-btn" onclick="switchTab('projects')">📁 Projects</button>
        </div>

        <!-- Conversations Tab -->
        <div id="tab-conversations">
          <div class="conv-header-bar">
            <input type="text" id="search-input" placeholder="Search conversations...">
            <button class="secondary" onclick="exportCSV()">Export CSV</button>
            <span class="info" id="conv-count"></span>
          </div>
          <div id="conversations"></div>
        </div>

        <!-- Usage Summary Tab -->
        <div id="tab-usage" class="hidden">
          <div class="stat-grid" id="user-stats"></div>
          <div class="card">
            <div class="section-header">
              <h3>Activity over time</h3>
              <div class="period-tabs" id="user-period-tabs">
                <button class="period-btn active" onclick="switchUserPeriod('daily')">Daily</button>
                <button class="period-btn" onclick="switchUserPeriod('weekly')">Weekly</button>
                <button class="period-btn" onclick="switchUserPeriod('monthly')">Monthly</button>
              </div>
            </div>
            <div id="user-activity-table"></div>
          </div>
        </div>

        <!-- Projects Tab -->
        <div id="tab-projects" class="hidden">
          <div id="user-projects-container"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let usersData = null;
    let conversationsData = [];
    let projectsData = [];
    let loadedFiles = [];
    let projectMap = {};
    let userMap = {};
    let convByUser = {};
    let selectedUserId = null;
    let convUuidField = '';
    let userUuidField = '';
    let usernameField = '';
    let activeTab = 'conversations';
    let teamPeriod = 'daily';
    let userPeriod = 'daily';

    // File upload handlers
    document.getElementById('user-input').addEventListener('change', e => loadUserFile(e.target.files[0]));
    document.getElementById('conv-input').addEventListener('change', e => loadConvFiles(Array.from(e.target.files)));
    document.getElementById('proj-input').addEventListener('change', e => loadProjectFile(e.target.files[0]));
    document.getElementById('folder-input').addEventListener('change', e => handleFolderSelect(Array.from(e.target.files)));
    document.getElementById('user-search').addEventListener('input', e => renderUserLeaderboard(e.target.value));

    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('dragover'); }
    function handleDrop(e, type) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.json'));
      if (!files.length) return;
      if (type === 'user') loadUserFile(files[0]);
      else if (type === 'proj') loadProjectFile(files[0]);
      else loadConvFiles(files);
    }

    function loadUserFile(file) {
      if (!file) return;
      document.getElementById('user-status').textContent = 'Loading...';
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const json = JSON.parse(ev.target.result);
          usersData = Array.isArray(json) ? json : [json];
          document.getElementById('user-status').textContent = `✓ ${usersData.length.toLocaleString()} users`;
          document.getElementById('user-zone').classList.add('loaded');
          autoDetectUserFields();
          hideError();
          checkBothLoaded();
        } catch (err) {
          showError(`Error parsing users file: ${err.message}`);
          document.getElementById('user-status').textContent = 'Error';
        }
      };
      reader.readAsText(file);
    }

    function loadConvFiles(files) {
      if (!files.length) return;
      document.getElementById('conv-status').textContent = 'Loading...';
      conversationsData = [];
      loadedFiles = [];
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const json = JSON.parse(ev.target.result);
            const data = Array.isArray(json) ? json : [json];
            conversationsData = conversationsData.concat(data);
            loadedFiles.push({ name: file.name, count: data.length });
            loaded++;
            if (loaded === files.length) {
              document.getElementById('conv-status').textContent =
                `✓ ${conversationsData.length.toLocaleString()} conversations (${files.length} file${files.length > 1 ? 's' : ''})`;
              document.getElementById('conv-zone').classList.add('loaded');
              autoDetectConvField();
              hideError();
              checkBothLoaded();
            }
          } catch (err) {
            showError(`Error parsing ${file.name}: ${err.message}`);
          }
        };
        reader.readAsText(file);
      });
    }

    document.getElementById('add-conv-input').addEventListener('change', e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const json = JSON.parse(ev.target.result);
            const data = Array.isArray(json) ? json : [json];
            conversationsData = conversationsData.concat(data);
            loadedFiles.push({ name: file.name, count: data.length });
            loaded++;
            if (loaded === files.length) {
              reprocessConversations();
              renderTeamOverview();
              hideError();
            }
          } catch (err) { showError(`Error parsing ${file.name}: ${err.message}`); }
        };
        reader.readAsText(file);
      });
      e.target.value = '';
    });

    function handleFolderSelect(files) {
      const jsonFiles = files.filter(f => f.name.toLowerCase().endsWith('.json'));
      if (!jsonFiles.length) { showError('No JSON files found in the selected folder.'); return; }

      let usersFile = null, convFiles = [], projFile = null;
      jsonFiles.forEach(f => {
        const name = f.name.toLowerCase();
        if (name.includes('user')) usersFile = f;
        else if (name.includes('conversation')) convFiles.push(f);
        else if (name.includes('project')) projFile = f;
      });

      document.getElementById('folder-zone').classList.add('loaded');
      document.getElementById('folder-status').textContent = jsonFiles.length + ' JSON file' + (jsonFiles.length !== 1 ? 's' : '') + ' found';
      document.getElementById('detected-files').classList.remove('hidden');

      const setRow = (rowId, valId, file, optional) => {
        const row = document.getElementById(rowId);
        if (file) {
          row.classList.add('found'); row.classList.remove('missing');
          document.getElementById(valId).textContent = Array.isArray(file) ? file.map(f => f.name).join(', ') : file.name;
        } else {
          row.classList.add('missing');
          document.getElementById(valId).textContent = optional ? 'Not found (optional)' : 'Not found';
        }
      };

      setRow('det-users', 'det-users-val', usersFile, false);
      setRow('det-convs', 'det-convs-val', convFiles.length ? convFiles : null, false);
      setRow('det-projects', 'det-projects-val', projFile, true);

      if (usersFile) loadUserFile(usersFile);
      if (convFiles.length) loadConvFiles(convFiles);
      if (projFile) loadProjectFile(projFile);
    }

    function loadProjectFile(file) {
      if (!file) return;
      document.getElementById('proj-status').textContent = 'Loading...';
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const json = JSON.parse(ev.target.result);
          projectsData = Array.isArray(json) ? json : [json];
          document.getElementById('proj-status').textContent = '\u2713 ' + projectsData.length.toLocaleString() + ' projects';
          document.getElementById('proj-zone').classList.add('loaded');
          buildProjectMap();
          hideError();
        } catch (err) {
          showError('Error parsing projects file: ' + err.message);
          document.getElementById('proj-status').textContent = 'Error';
        }
      };
      reader.readAsText(file);
    }

    function buildProjectMap() {
      projectMap = {};
      projectsData.forEach(p => {
        const id = p.uuid || p.id || p.project_id;
        if (!id) return;
        projectMap[id] = {
          uuid: id,
          name: p.name || p.title || p.project_name || 'Unnamed Project',
          createdAt: p.created_at || p.createdAt || null,
          ownerUuid: p.creator?.uuid || p.account?.uuid || p.owner_uuid || p.user_id || null,
          docs: p.docs || [],
          description: p.description || '',
          isPrivate: p.is_private ?? true,
          isStarter: p.is_starter_project ?? false
        };
      });
    }

    function checkBothLoaded() {
      if (usersData && conversationsData.length) {
        document.getElementById('load-btn-container').classList.remove('hidden');
      }
    }

    function autoDetectUserFields() {
      if (!usersData?.[0]) return;
      const keys = Object.keys(usersData[0]);
      for (const g of ['uuid', 'id', 'user_id', 'userId']) { if (keys.includes(g)) { userUuidField = g; break; } }
      for (const g of ['full_name', 'username', 'name', 'displayName', 'display_name', 'email']) { if (keys.includes(g)) { usernameField = g; break; } }
    }

    function autoDetectConvField() {
      if (!conversationsData?.[0]) return;
      const conv = conversationsData[0];
      if (conv?.account?.uuid) { convUuidField = 'account.uuid'; return; }
      const keys = Object.keys(conv);
      for (const g of ['user_id', 'userId', 'user_uuid', 'account_uuid', 'uuid']) { if (keys.includes(g)) { convUuidField = g; break; } }
    }

    function getNestedValue(obj, path) {
      return path.split('.').reduce((acc, part) => acc?.[part], obj);
    }

    function processData() {
      if (!userUuidField || !usernameField || !convUuidField) {
        showError('Could not auto-detect field mappings. Please check your files.');
        return;
      }
      userMap = {};
      usersData.forEach(u => {
        const id = u[userUuidField];
        if (id) userMap[id] = {
          uuid: id,
          name: u[usernameField] || u.email_address || u.email || 'Unknown',
          email: u.email_address || u.email || '',
          count: 0
        };
      });
      reprocessConversations();
      document.getElementById('setup-section').classList.add('hidden');
      document.getElementById('viewer-section').classList.remove('hidden');
      renderTeamOverview();
      hideError();
    }

    function reprocessConversations() {
      Object.values(userMap).forEach(u => u.count = 0);
      convByUser = {};
      conversationsData.forEach(c => {
        const userId = getNestedValue(c, convUuidField);
        if (!convByUser[userId]) convByUser[userId] = [];
        convByUser[userId].push(c);
        if (userMap[userId]) userMap[userId].count++;
      });
      Object.keys(convByUser).forEach(id => {
        convByUser[id].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      });
    }

    // ─── Team Overview ───────────────────────────────────────────────────────

    function renderTeamOverview() {
      const allConvs = conversationsData;
      const totalMsgs = allConvs.reduce((s, c) => s + (c.chat_messages?.length || 0), 0);
      const activeUsers = Object.values(userMap).filter(u => u.count > 0).length;
      const dates = allConvs.map(c => new Date(c.created_at)).filter(d => !isNaN(d));
      const earliest = dates.length ? new Date(Math.min(...dates)) : null;
      const latest = dates.length ? new Date(Math.max(...dates)) : null;
      const dateRange = earliest && latest
        ? `${earliest.toLocaleDateString()} – ${latest.toLocaleDateString()}` : '—';

      document.getElementById('team-stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Active Users</div>
          <div class="stat-value">${activeUsers}</div>
          <div class="stat-sub">of ${Object.keys(userMap).length} total</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Conversations</div>
          <div class="stat-value">${allConvs.length.toLocaleString()}</div>
          <div class="stat-sub">${dateRange}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Messages</div>
          <div class="stat-value">${totalMsgs.toLocaleString()}</div>
          <div class="stat-sub">avg ${allConvs.length ? (totalMsgs / allConvs.length).toFixed(1) : 0} per conversation</div>
        </div>
                <div class="stat-card">
          <div class="stat-label">Projects</div>
          <div class="stat-value">${Object.keys(projectMap).length || '\u2014'}</div>
          <div class="stat-sub">${Object.keys(projectMap).length ? Object.keys(projectMap).length + ' projects loaded' : 'No projects file loaded'}</div>
        </div>
      `;

      renderTeamActivity();
      renderUserLeaderboard();
      renderTeamProjects();
    }

    function switchTeamPeriod(period) {
      teamPeriod = period;
      document.querySelectorAll('#team-period-tabs .period-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === period);
      });
      renderTeamActivity();
    }

    function renderTeamActivity() {
      const buckets = buildBuckets(conversationsData, teamPeriod);
      const rows = Object.values(buckets).sort((a, b) => b.key.localeCompare(a.key)).slice(0, 30);
      const maxCount = Math.max(...rows.map(r => r.count), 1);

      document.getElementById('team-activity-table').innerHTML = rows.length ? `
        <table class="data-table">
          <thead><tr>
            <th>${teamPeriod.charAt(0).toUpperCase() + teamPeriod.slice(1)}</th>
            <th>Conversations</th>
            <th>Messages</th>
            <th style="width:180px;">Activity</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr class="non-clickable">
                <td>${escapeHtml(r.label)}</td>
                <td>${r.count}</td>
                <td>${r.msgs}</td>
                <td><div class="bar-wrap"><div class="bar-fill blue" style="width:${Math.round((r.count/maxCount)*100)}%"></div></div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<div class="no-data">No activity data</div>';
    }

    function renderUserLeaderboard(filter = '') {
      const users = Object.values(userMap)
        .filter(u => u.name.toLowerCase().includes(filter.toLowerCase()))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
      const maxCount = Math.max(...users.map(u => u.count), 1);

      document.getElementById('user-leaderboard').innerHTML = users.length ? `
        <table class="data-table">
          <thead><tr>
            <th style="width:32px;">#</th>
            <th>User</th>
            <th>Conversations</th>
            <th>Messages</th>
            <th style="width:180px;">Activity</th>
          </tr></thead>
          <tbody>
            ${users.map((u, i) => {
              const msgs = (convByUser[u.uuid] || []).reduce((s, c) => s + (c.chat_messages?.length || 0), 0);
              return `
                <tr onclick="selectUser('${u.uuid}')">
                  <td class="rank">${i + 1}</td>
                  <td class="user-name-cell">${escapeHtml(u.name)}</td>
                  <td>${u.count}</td>
                  <td>${msgs.toLocaleString()}</td>
                  <td><div class="bar-wrap"><div class="bar-fill teal" style="width:${Math.round((u.count/maxCount)*100)}%"></div></div></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      ` : '<div class="no-data">No users found</div>';
    }

    // ─── User Detail ─────────────────────────────────────────────────────────

    function selectUser(uuid) {
      selectedUserId = uuid;
      const user = userMap[uuid];
      const convs = convByUser[uuid] || [];
      const msgs = convs.reduce((s, c) => s + (c.chat_messages?.length || 0), 0);

      document.getElementById('team-overview').classList.add('hidden');
      document.getElementById('user-detail').classList.remove('hidden');
      document.getElementById('user-detail-name').textContent = user?.name || 'Unknown';
      document.getElementById('user-detail-meta').textContent =
        `${convs.length.toLocaleString()} conversations · ${msgs.toLocaleString()} messages`;

      // Reset to conversations tab
      switchTab('conversations');
    }

    function backToOverview() {
      selectedUserId = null;
      document.getElementById('user-detail').classList.add('hidden');
      document.getElementById('team-overview').classList.remove('hidden');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active',
          (i === 0 && tab === 'conversations') ||
          (i === 1 && tab === 'usage') ||
          (i === 2 && tab === 'projects'));
      });
      document.getElementById('tab-conversations').classList.toggle('hidden', tab !== 'conversations');
      document.getElementById('tab-usage').classList.toggle('hidden', tab !== 'usage');
      document.getElementById('tab-projects').classList.toggle('hidden', tab !== 'projects');
      if (tab === 'conversations') renderConversations();
      if (tab === 'usage') renderUserUsage();
      if (tab === 'projects') renderUserProjects();
    }

    function renderConversations() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const userConvs = convByUser[selectedUserId] || [];
      const userName = userMap[selectedUserId]?.name || 'Unknown';

      const filtered = userConvs.filter(c => {
        if (!search) return true;
        return c.name?.toLowerCase().includes(search) ||
          c.chat_messages?.some(m => m.text?.toLowerCase().includes(search));
      });

      document.getElementById('conv-count').textContent =
        `${filtered.length} conversation${filtered.length !== 1 ? 's' : ''}`;

      const container = document.getElementById('conversations');
      if (!filtered.length) {
        container.innerHTML = '<div class="no-data">No conversations found</div>';
        return;
      }

      container.innerHTML = filtered.slice(0, 100).map((conv, i) => `
        <div class="conversation">
          <div class="conv-header" onclick="toggleConv(this, ${i})">
            <span class="arrow">▶</span>
            <div class="conv-title">
              <h3>${escapeHtml(conv.name || 'Untitled Conversation')}</h3>
              <p>${formatDate(conv.created_at)}</p>
            </div>
            <span class="conv-badge">${conv.chat_messages?.length || 0} msgs</span>
          </div>
          <div class="messages hidden" id="msgs-${i}">
            ${(conv.chat_messages || []).map(m => `
              <div class="message ${m.sender}">
                <div class="sender">${m.sender === 'human' ? escapeHtml(userName) : 'Claude'}</div>
                <div class="text">${escapeHtml((m.text || '').substring(0, 3000))}${(m.text?.length || 0) > 3000 ? '…' : ''}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      if (filtered.length > 100) {
        container.innerHTML += '<p style="text-align:center;padding:20px;color:#6b7280;font-size:0.85rem;">Showing first 100. Use search to find specific conversations.</p>';
      }
    }

    document.getElementById('search-input').addEventListener('input', renderConversations);

    function toggleConv(header, index) {
      header.classList.toggle('expanded');
      document.getElementById('msgs-' + index).classList.toggle('hidden');
    }

    function renderUserUsage() {
      const userConvs = convByUser[selectedUserId] || [];

      if (!userConvs.length) {
        document.getElementById('user-activity-table').innerHTML = '<div class="no-data">No conversations to summarise</div>';
        return;
      }

      const totalMsgs = userConvs.reduce((s, c) => s + (c.chat_messages?.length || 0), 0);
      const humanMsgs = userConvs.reduce((s, c) => s + (c.chat_messages?.filter(m => m.sender === 'human').length || 0), 0);
      const dates = userConvs.map(c => new Date(c.created_at)).filter(d => !isNaN(d));
      const earliest = dates.length ? new Date(Math.min(...dates)) : null;
      const latest = dates.length ? new Date(Math.max(...dates)) : null;
      const spanDays = earliest && latest ? Math.max(1, Math.round((latest - earliest) / 86400000) + 1) : 1;

      document.getElementById('user-stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Conversations</div>
          <div class="stat-value">${userConvs.length.toLocaleString()}</div>
          <div class="stat-sub">${humanMsgs.toLocaleString()} user messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Messages</div>
          <div class="stat-value">${totalMsgs.toLocaleString()}</div>
          <div class="stat-sub">avg ${(totalMsgs / userConvs.length).toFixed(1)} per conversation</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg / Day</div>
          <div class="stat-value">${(userConvs.length / spanDays).toFixed(1)}</div>
          <div class="stat-sub">over ${spanDays} day${spanDays !== 1 ? 's' : ''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Date Range</div>
          <div class="stat-value" style="font-size:1rem;">${earliest ? earliest.toLocaleDateString() : '—'}</div>
          <div class="stat-sub">to ${latest ? latest.toLocaleDateString() : '—'}</div>
        </div>
      `;

      renderUserActivity(userConvs);
    }

    function switchUserPeriod(period) {
      userPeriod = period;
      document.querySelectorAll('#user-period-tabs .period-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === period);
      });
      renderUserActivity(convByUser[selectedUserId] || []);
    }

    function renderUserActivity(userConvs) {
      const buckets = buildBuckets(userConvs, userPeriod);
      const rows = Object.values(buckets).sort((a, b) => b.key.localeCompare(a.key));
      const maxCount = Math.max(...rows.map(r => r.count), 1);

      document.getElementById('user-activity-table').innerHTML = rows.length ? `
        <table class="data-table">
          <thead><tr>
            <th>${userPeriod.charAt(0).toUpperCase() + userPeriod.slice(1)}</th>
            <th>Conversations</th>
            <th>Messages</th>
            <th style="width:180px;">Activity</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr class="non-clickable">
                <td>${escapeHtml(r.label)}</td>
                <td>${r.count}</td>
                <td>${r.msgs}</td>
                <td><div class="bar-wrap"><div class="bar-fill blue" style="width:${Math.round((r.count/maxCount)*100)}%"></div></div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<div class="no-data">No activity data</div>';
    }

    // ─── Shared helpers ───────────────────────────────────────────────────────

    function buildBuckets(convs, period) {
      const buckets = {};
      convs.forEach(c => {
        const d = new Date(c.created_at);
        if (isNaN(d)) return;
        const key = getPeriodKey(d, period);
        if (!buckets[key]) buckets[key] = { key, label: getPeriodLabel(new Date(c.created_at), period), count: 0, msgs: 0 };
        buckets[key].count++;
        buckets[key].msgs += c.chat_messages?.length || 0;
      });
      return buckets;
    }

    function getPeriodKey(date, period) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      if (period === 'daily') return `${y}-${m}-${d}`;
      if (period === 'weekly') {
        const jan1 = new Date(y, 0, 1);
        const week = String(Math.ceil(((date - jan1) / 86400000 + jan1.getDay() + 1) / 7)).padStart(2, '0');
        return `${y}-W${week}`;
      }
      return `${y}-${m}`;
    }

    function getPeriodLabel(date, period) {
      if (period === 'daily') return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      if (period === 'weekly') {
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(new Date(date).setDate(diff));
        return 'Week of ' + monday.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function exportCSV() {
      const userConvs = convByUser[selectedUserId] || [];
      const userName = userMap[selectedUserId]?.name || 'Unknown';
      let csv = 'Conversation Name,Date,Message Count,First Message\n';
      userConvs.forEach(c => {
        const firstMsg = c.chat_messages?.[0]?.text?.substring(0, 100).replace(/[\n\r,]/g, ' ') || '';
        csv += `"${(c.name || '').replace(/"/g, '""')}","${formatDate(c.created_at)}",${c.chat_messages?.length || 0},"${firstMsg.replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${userName.replace(/[^a-z0-9]/gi, '_')}_conversations.csv`;
      a.click();
    }

    function startOver() {
      usersData = null;
      conversationsData = [];
      loadedFiles = [];
      userMap = {};
      convByUser = {};
      selectedUserId = null;
      document.getElementById('user-zone').classList.remove('loaded');
      document.getElementById('conv-zone').classList.remove('loaded');
      document.getElementById('proj-zone').classList.remove('loaded');
      document.getElementById('folder-zone').classList.remove('loaded');
      document.getElementById('user-status').textContent = 'Click or drag & drop';
      document.getElementById('conv-status').textContent = 'Click or drag & drop';
      document.getElementById('proj-status').textContent = 'Click or drag & drop';
      document.getElementById('folder-status').textContent = 'Click to select your Claude Teams export folder \u2014 files are detected automatically';
      document.getElementById('detected-files').classList.add('hidden');
      document.getElementById('load-btn-container').classList.add('hidden');
      document.getElementById('user-input').value = '';
      document.getElementById('conv-input').value = '';
      document.getElementById('proj-input').value = '';
      document.getElementById('folder-input').value = '';
      projectsData = [];
      projectMap = {};
      document.getElementById('viewer-section').classList.add('hidden');
      document.getElementById('user-detail').classList.add('hidden');
      document.getElementById('team-overview').classList.remove('hidden');
      document.getElementById('setup-section').classList.remove('hidden');
    }

    function renderTeamProjects() {
      const projects = Object.values(projectMap);
      const el = document.getElementById('projects-overview');
      if (!projects.length) { el.style.display = 'none'; return; }
      el.style.display = '';
      document.getElementById('projects-count').textContent =
        projects.length + ' project' + (projects.length !== 1 ? 's' : '');
      const sorted = [...projects].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      document.getElementById('projects-table').innerHTML = `
        <table class="data-table">
          <thead><tr>
            <th>Project</th><th>Creator</th><th>Created</th><th>Docs</th><th>Visibility</th>
          </tr></thead>
          <tbody>
            ${sorted.map(p => {
              const creator = userMap[p.ownerUuid];
              const vis = p.isStarter ? 'Starter' : p.isPrivate ? 'Private' : 'Shared';
              const visBg = p.isStarter ? '#1d4ed8' : p.isPrivate ? '#374151' : 'rgba(34,197,94,0.15)';
              const visCol = p.isStarter ? '#bfdbfe' : p.isPrivate ? '#9ca3af' : '#4ade80';
              return `<tr class="non-clickable">
                <td>
                  <div style="font-weight:500;">${escapeHtml(p.name)}</div>
                  ${p.description ? `<div style="font-size:0.75rem;color:#6b7280;margin-top:2px;">${escapeHtml(p.description.substring(0, 80))}${p.description.length > 80 ? '...' : ''}</div>` : ''}
                </td>
                <td>${escapeHtml(creator?.name || '--')}</td>
                <td style="white-space:nowrap;">${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '--'}</td>
                <td>${p.docs.length}</td>
                <td><span style="font-size:0.75rem;padding:2px 8px;border-radius:10px;background:${visBg};color:${visCol};">${vis}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    function renderUserProjects() {
      const userProjects = Object.values(projectMap).filter(p => p.ownerUuid === selectedUserId);
      const container = document.getElementById('user-projects-container');
      if (!userProjects.length) {
        container.innerHTML = '<div class="no-data">No projects created by this user</div>';
        return;
      }
      const sorted = [...userProjects].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      container.innerHTML = sorted.map(p => {
        const vis = p.isStarter ? 'Starter' : p.isPrivate ? 'Private' : 'Shared';
        const visBg = p.isStarter ? '#1d4ed8' : p.isPrivate ? '#374151' : 'rgba(34,197,94,0.15)';
        const visCol = p.isStarter ? '#bfdbfe' : p.isPrivate ? '#9ca3af' : '#4ade80';
        return `
        <div class="conversation" style="margin-bottom:10px;">
          <div style="padding:14px 16px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <div>
                <div style="font-weight:600;font-size:0.95rem;">${escapeHtml(p.name)}</div>
                ${p.description ? `<div style="font-size:0.82rem;color:#9ca3af;margin-top:4px;">${escapeHtml(p.description)}</div>` : ''}
                <div style="font-size:0.75rem;color:#6b7280;margin-top:6px;">Created ${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '--'}</div>
              </div>
              <div style="display:flex;gap:8px;flex-shrink:0;align-items:center;">
                ${p.docs.length ? `<span class="conv-badge">docs: ${p.docs.length}</span>` : ''}
                <span style="font-size:0.75rem;padding:3px 8px;border-radius:10px;background:${visBg};color:${visCol};">${vis}</span>
              </div>
            </div>
            ${p.docs.length ? `
              <div style="margin-top:10px;border-top:1px solid #374151;padding-top:10px;">
                ${p.docs.map(d => `<div style="font-size:0.8rem;color:#9ca3af;padding:3px 0;">${escapeHtml(d.filename)}</div>`).join('')}
              </div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() { document.getElementById('error').classList.add('hidden'); }
  </script>
</body>
</html>
